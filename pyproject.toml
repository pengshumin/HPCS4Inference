[build-system]
requires = ["setuptools>=64", "wheel", "torch", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "HPCS4Inference"
version = "0.1.0"
description = "Fused CUDA kernels for accelerated Qwen3 inference"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "pybind11",
]

[project.optional-dependencies]
chat = ["bitsandbytes"]

[tool.setuptools]
packages = ["hpcs4inference"]
